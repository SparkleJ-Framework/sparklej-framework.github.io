<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - SparkleJ Framework</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f9f9f9;
            color: #333;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* HEADER */
        header {
            background-color: #4a4a4a;
            width: 100%;
            padding: 15px 0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo-group {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-group img {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        .logo-group b {
            color: white;
            font-size: 1.25rem;
        }

        nav {
            display: flex;
            gap: 25px;
        }

        nav a {
            color: #e0e0e0;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }.nav-links a {
                color: #e0e0e0;
                text-decoration: none;
                margin-left: 20px;
                font-weight: 500;
                transition: color 0.2s;
            }

            .nav-links a:hover {
                color: #fff;
            }

        /* MAIN */
        .content {
            max-width: 800px;
            margin: 40px auto;
            padding: 60px 40px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            text-align: center;
            flex-grow: 1;
        }

        .content h1 {
            color: #2c3e50;
            font-size: 4rem;
            margin-bottom: 0.5rem;
        }

        .content p {
            margin-bottom: 0.5rem;
        }

        .content p.subtitle {
            font-size: 1.5rem;
            color: #555;
        }

        .content p.hint {
            font-size: 1.2rem;
            color: #555;
        }

        .content a {
            color: #007bff;
            text-decoration: none;
            font-size: 1.1rem;
            display: inline-block;
            margin-top: 1rem;
            transition: color 0.2s;
        }

        .content a:hover {
            color: #0056b3;
        }
    </style>
</head>
<body>
    <header>
            <div class="header-container">
                <div class="logo-group">
                    <img src="/favicon.ico" alt="SparkleJ Logo">
                    <b>SparkleJ Framework</b>
                </div>
                <nav class="nav-links">
                    <a href="/">Home</a>
                    <a href="https://github.com/SparkleJ-Framework">GitHub</a>
                </nav>
            </div>
        </header>
    <div class="content">
        <h1>404</h1>
        <p class="subtitle">Nothing to see here.</p>
        <p class="hint">Need a map?</p>
        <a href="/">Home Page</a>
    </div>
</body>
</html>
